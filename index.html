<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оно тебе надо — аукцион вещей, в которые никто не верил</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="header">
      <!-- Здесь будут меню, логотип и адрес -->
    </header>

    <main>
      <section class="cover">
        <div class="overlay"></div>

        <h1 class="cover__title">
          <span class="aligned-text">Оно</span>
          <span class="aligned-text aligned-text_center">тебе</span>
          <span class="aligned-text aligned-text_right">надо</span>
        </h1>

        <div class="cover__description">
          <p class="cover__description-text">
            Аукцион вещей, в которые никто не верил
          </p>
          <button class="bet-button" type="button">Сделать ставку</button>
        </div>
      </section>

      <section class="lots" id="lots">
        <h2 class="lots__heading">Лоты</h2>
        <!-- Здесь будут карточки лотов -->
        <a class="lots__look-more-link" href="#lots">Посмотреть больше</a>
      </section>

      <section class="about" id="about">
        <div class="about__column">
          <!-- Здесь будет логотип в чёрном круге -->
        </div>

        <div class="about__column">
          <h2 class="about__title">Об аукционе</h2>
          <div class="about__text">
            <!-- Здесь будут два абзаца из макета -->
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <!-- Здесь будут адрес, меню и социальные сети -->
    </footer>
  </body>
</html>
